name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura_test
          POSTGRES_PASSWORD: aura_test
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      SUPABASE_DB_URL: postgresql://aura_test:aura_test@localhost:5432/aura_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-aura-2026
      JWT_EXPIRES_IN: 1h
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: node --check src/index.js

      - name: Apply test schema
        env:
          PGPASSWORD: aura_test
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "-> Applying $f"
            psql -h localhost -U aura_test -d aura_test -v ON_ERROR_STOP=1 -f "$f"
            echo "   OK: $f"
          done

      - name: Run tests
        run: node node_modules/jest/bin/jest.js --forceExit --detectOpenHandles --runInBand --coverage

      - name: Upload coverage
        if: success() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
