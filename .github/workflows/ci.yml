name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura_test
          POSTGRES_PASSWORD: aura_test
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      SUPABASE_DB_URL: postgresql://aura_test:aura_test@localhost:5432/aura_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: aura-test-secret-2026
      JWT_EXPIRES_IN: 1h
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: node --check src/index.js

      - name: Apply test schema
        env:
          PGPASSWORD: aura_test
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "-> Applying $f"
            psql -h localhost -U aura_test -d aura_test -v ON_ERROR_STOP=1 -f "$f"
            echo "   OK: $f"
          done

      # Heap: o padrão do Node (~2 GB) virou o teto da suíte em 27/07/2026
      # (OOM, exit 134, com ZERO teste falhando). --runInBand + --coverage
      # acumulam módulos e mapas de cobertura num processo só; 4 GB dá
      # folga num runner de 16 GB.
      #
      # --detectOpenHandles saiu de propósito: ele guarda o stack trace de
      # todo handle assíncrono aberto (e o repo sobe Express/WS em dezenas
      # de suítes). É ferramenta de diagnóstico local — em CI, com
      # --forceExit, só custava memória. Para investigar handle vazando,
      # rode localmente: npx jest --detectOpenHandles <arquivo>
      - name: Run tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node node_modules/jest/bin/jest.js --forceExit --runInBand --coverage
