name: Deploy

# QUEM FAZ O DEPLOY É A RAILWAY (t1-01, 14/10/2026) — leia docs/deploy.md.
#
# O serviço está ligado ao GitHub com "Wait for CI" (checkSuites): a cada
# push em main a Railway cria o deploy e espera TODOS os workflows do commit
# terminarem (CI e este). Se algum falhar, o deploy é pulado.
#
# Até 13/10 este workflow também rodava `railway up` e `railway variables
# set GIT_SHA=...`. Cada um criava um deploy a mais: 40 deploys para 13
# merges em 13/10 (3,1 por merge), e 19 de 20 rajadas de EMAXCONNSESSION
# em 7 dias começaram numa troca de versão. O /health agora lê o commit de
# RAILWAY_GIT_COMMIT_SHA (src/config/env.js, shaDaVersao), que a própria
# Railway injeta, então nenhum passo daqui precisa tocar na Railway.
#
# Sobrou só a release do Sentry. Ela não pode falhar (continue-on-error):
# como a Railway espera este workflow, uma falha aqui pularia o deploy.
# Pelo mesmo motivo este workflow NÃO espera o /health mostrar o sha novo:
# a Railway só sobe depois que ele termina. Quem confere a versão no ar é o
# verificador de produção (t1-04).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  sentry-release:
    name: Sentry release (o deploy é da integração GitHub da Railway)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nem o checkout pode derrubar o deploy: falha aqui não falha o workflow.
    continue-on-error: true
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create Sentry release
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            npm install -g @sentry/cli
            # 8 caracteres: o mesmo que o backend usa (shaDaVersao em src/config/env.js)
            VERSION="aura-backend@$(git rev-parse --short=8 HEAD)"
            sentry-cli releases new "$VERSION"
            sentry-cli releases set-commits "$VERSION" --auto --ignore-missing || echo "set-commits falhou (API Sentry instavel) — ignorando"
            sentry-cli releases finalize "$VERSION"
            sentry-cli releases deploys "$VERSION" new -e production
            echo "Sentry release criada: $VERSION"
          else
            echo "SENTRY_AUTH_TOKEN nao configurado, pulando release Sentry"
          fi
